<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - MealVerse</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <div id="navbar-placeholder"></div>

    <header class="contact-hero">
        <div class="container text-center text-white">
            <h1 class="fw-bold">Get In <span class="text-primary">Touch</span></h1>
            <p class="lead">Have questions, feedback, or need help with a recipe? We'd love to hear from you!</p>
        </div>
    </header>

    <section class="contact-section py-5">
        <div class="container">
            <div class="row g-4">
                <div class="col-lg-4">
                    <div class="contact-info-wrapper h-100 d-flex flex-column justify-content-between p-4 rounded-4">
                        <div>
                            <h3 class="fw-bold text-white mb-4">Contact Information</h3>

                            <div class="info-item d-flex align-items-center mb-4">
                                <div class="info-icon me-3"><i class="fas fa-location-dot"></i></div>
                                <div>
                                    <h6 class="text-white mb-0">Our Location</h6>
                                    <small class="text-white-50">Rajarata university, Sri Lanka</small>
                                </div>
                            </div>

                            <div class="info-item d-flex align-items-center mb-4">
                                <div class="info-icon me-3"><i class="fas fa-envelope"></i></div>
                                <div>
                                    <h6 class="text-white mb-0">Email Us</h6>
                                    <small class="text-white-50">support@mealverse.com</small>
                                </div>
                            </div>

                            <div class="info-item d-flex align-items-center mb-4">
                                <div class="info-icon me-3"><i class="fas fa-phone"></i></div>
                                <div>
                                    <h6 class="text-white mb-0">Call Us</h6>
                                    <small class="text-white-50">+94 71 123 4567</small>
                                </div>
                            </div>
                        </div>

                        <div class="social-links mt-4">
                            <h6 class="text-white mb-3">Follow Us</h6>
                            <a href="#" class="social-btn"><i class="fab fa-facebook-f"></i></a>
                            <a href="#" class="social-btn"><i class="fab fa-instagram"></i></a>
                            <a href="#" class="social-btn"><i class="fab fa-twitter"></i></a>
                            <a href="#" class="social-btn"><i class="fab fa-youtube"></i></a>
                        </div>
                    </div>
                </div>

                <div class="col-lg-8">
                    <div class="contact-form-card bg-white p-4 p-md-5 rounded-4 shadow-sm">
                        <h3 class="fw-bold mb-4">Send Us a Message</h3>

                        <form action="#" method="post">
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Your Name</label>
                                    <input type="text" class="form-control custom-input" placeholder="Your Name" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Email Address</label>
                                    <input type="email" class="form-control custom-input" placeholder="Your Email" required>
                                </div>
                                <div class="col-12">
                                    <label class="form-label fw-semibold">Subject</label>
                                    <input type="text" class="form-control custom-input" placeholder="Recipe inquiry / Support" required>
                                </div>
                                <div class="col-12">
                                    <label class="form-label fw-semibold">Message</label>
                                    <textarea class="form-control custom-input" rows="5" placeholder="Write your message here..." required></textarea>
                                </div>
                                <div class="col-12 mt-4">
                                    <button type="submit" class="btn btn-primary px-5 py-3 rounded-pill fw-bold">
                                        Send Message <i class="fas fa-paper-plane ms-2"></i>
                                    </button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <div id="footer-placeholder"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/nav.js"></script>
    <script src="js/footer.js"></script>
</body>
</html>
